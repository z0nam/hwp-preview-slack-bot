[project]
name = "hwp-pdf-slack-bot"
version = "2026.05.14.1"
description = "JRI Slack workspace admin tooling — HWP→PDF preview bot, ops scripts"
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.21",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwp_pdf_slack_bot"]
