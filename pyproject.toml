[project]
name = "ji-slack-admin"
version = "0.1.0"
description = "JRI Slack workspace admin tooling — HWP→PDF preview bot, ops scripts"
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.21",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ji_slack_admin"]
